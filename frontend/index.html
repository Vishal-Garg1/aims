<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AIMS Portal - Login</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f9e3d2;
      color: #333;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      background-color: #fff;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      padding: 40px;
      text-align: center;
      width: 300px;
    }

    h1 {
      font-size: 36px;
      color: #bfa98d;
      margin-bottom: 30px;
    }

    label {
      font-size: 18px;
      margin-bottom: 10px;
      display: block;
    }

    input[type="email"], input[type="text"] {
      width: 100%;
      padding: 10px;
      margin-bottom: 20px;
      border: 2px solid #ccc;
      border-radius: 5px;
      font-size: 16px;
    }

    .otp-section {
      display: none;
      margin-top: 20px;
    }

    button {
      background-color: #e2c9a3;
      color: white;
      border: none;
      padding: 12px 20px;
      font-size: 16px;
      border-radius: 5px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #d1b18d;
    }

    .arrow {
      cursor: pointer;
      display: inline-block;
      margin-left: 10px;
      transition: transform 0.2s ease;
    }

    .arrow:hover {
      transform: scale(1.2);
    }

    .change-email-link {
      margin-top: 20px;
      font-size: 14px;
      color: #bfa98d;
      cursor: pointer;
      text-decoration: underline;
    }

  </style>
</head>
<body>

  <div class="container">
    <h1>AIMS Portal</h1>
    <div id="emailSection">
      <label for="email">Your Email ID</label>
      <input type="email" id="email" placeholder="Enter your email" required>
      <br>
      <button id="getOtpBtn">Get OTP <span class="arrow">&#8594;</span></button>
    </div>

    <div class="otp-section" id="otpSection">
      <label for="otp">Enter OTP</label>
      <input type="text" id="otp" placeholder="Enter OTP" required>
      <br>
      <button id="verifyOtpBtn">Verify OTP</button>
      <div class="change-email-link" id="changeEmailLink">Change Email Address</div>
    </div>
  </div>

  <script>
    const getOtpBtn = document.getElementById("getOtpBtn");
    const otpSection = document.getElementById("otpSection");
    const otpInput = document.getElementById("otp");
    const verifyOtpBtn = document.getElementById("verifyOtpBtn");
    const emailInput = document.getElementById("email");
    const emailSection = document.getElementById("emailSection");
    const changeEmailLink = document.getElementById("changeEmailLink");
    const host = 'http://localhost:3000/api/v1/';

    getOtpBtn.addEventListener("click", function() {
      const email = emailInput.value;

      if (email) {
        fetch(`${host}auth/send-otp`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({ email: email })
        })
        .then(response => response.json())
        .then(data => {
          if (data.message === 'OTP sent successfully') {
            alert("OTP sent to your email!");
            otpSection.style.display = "block";
            emailSection.style.display = "none";
            getOtpBtn.style.cursor = "pointer";
            getOtpBtn.disabled = true;
          } else {
            alert("Error: " + data.message);
          }
        })
        .catch(error => {
          console.error("Error sending OTP:", error);
          alert("An error occurred while sending OTP.");
        });
      } else {
        alert("Please enter a valid email ID.");
      }
    });

    verifyOtpBtn.addEventListener("click", function() {
      const otp = otpInput.value;
      const email = emailInput.value;

      if (otp) {
        // Clear the OTP input field
        otpInput.value = '';

        fetch(`${host}auth/verify-otp`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          credentials: "include",
          body: JSON.stringify({ email: email, otp: otp })
        })
        .then(response => response.json())
        .then(data => {
          if (data.message === 'Logged in successfully') {
            alert("OTP Verified! You are logged in.");
            if (data.role === 'student') {
              window.location.href = "student.html";
            } else if (data.role === 'faculty') {
              window.location.href = "faculty.html";
            } else if (data.role === 'admin') {
              window.location.href = "admin.html";
            } else {
              alert("Unknown role. Please try again.");
            }
          } else {
            alert("Invalid OTP, please try again.");
          }
        })
        .catch(error => {
          console.error("Error verifying OTP:", error);
          alert("An error occurred while verifying OTP.");
        });
      } else {
        alert("Please enter OTP.");
      }
    });

    changeEmailLink.addEventListener("click", function() {
      otpSection.style.display = "none";
      emailSection.style.display = "block";
      getOtpBtn.disabled = false;
    });
  </script>

</body>
</html>
