<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faculty Dashboard</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="dashboard" id="faculty-dashboard">
        <h2>Faculty Dashboard</h2>
        
        <!-- Add Course Form -->
        <div class="add-course-section">
            <h3>Add a Course</h3>
            <form id="add-course-form">
                <div class="form-row">
                    <div class="form-group">
                        <label for="course-code">Course Code</label>
                        <input type="text" id="course-code" placeholder="Enter course code" required>
                    </div>
                    <div class="form-group">
                        <label for="course-title">Course Title</label>
                        <input type="text" id="course-title" placeholder="Enter course title" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="academic-session">Academic Session</label>
                        <input type="text" id="academic-session" placeholder="e.g., Fall 2025" required>
                    </div>
                    <div class="form-group">
                        <label for="instructor-id">Instructor ID</label>
                        <input type="text" id="instructor-id" placeholder="Enter instructor ID" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="offering-department">Offering Department</label>
                        <input type="text" id="offering-department" placeholder="Enter offering department" required>
                    </div>
                    <div class="form-group">
                        <label for="status">Status</label>
                        <select id="status" required>
                            <option value="open">Open</option>
                            <option value="closed">Closed</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="credits">Credits</label>
                        <input type="number" id="credits" placeholder="Enter course credits" required>
                    </div>
                </div>
                <div class="form-group">
                    <button type="button" onclick="addCourse()">Add Course</button>
                </div>
            </form>
        </div>

        <!-- Courses List -->
        <h3>Courses List</h3>
        <table>
            <thead>
                <tr>
                    <th>Course Code</th>
                    <th>Title</th>
                    <th>Session</th>
                    <th>Instructor ID</th>
                    <th>Department</th>
                    <th>Status</th>
                    <th>Credits</th>
                </tr>
            </thead>
            <tbody id="courses-list">
                <!-- Courses will be dynamically populated here -->
            </tbody>
        </table>
    </div>

    <script src="faculty.js"></script>
</body>
</html>
