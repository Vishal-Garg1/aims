<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard</title>
    <link rel="stylesheet" href="styles.css">
</head> 
<body>
    <div class="dashboard" id="student-dashboard">
        <h2>Student Dashboard</h2>
        <h3>Available Courses</h3>
        <table>
            <thead>
                <tr>
                    <th>Course Code</th>
                    <th>Title</th>
                    <th>Session</th>
                    <th>Instructor ID</th>
                    <th>Department</th>
                    <th>Status</th>
                    <th>Credits</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="available-courses">
                <!-- Courses will be dynamically populated here -->
            </tbody>
        </table>
    </div>
    <script src="student.js"></script>
</body>
</html>
